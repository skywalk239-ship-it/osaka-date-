<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>리호짱과 오사카 데이트 🌸</title>
<link href="https://fonts.googleapis.com/css2?family=Gmarket+Sans:wght@300;500;700&family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg0:#fdf6ec;--cream:#fff8f0;--gold:#d4943a;--gold2:#e8b86a;--brown:#6b3d14;--brown2:#9a6030;--brown3:#c49060;--text:#3a2010;--text2:#7a5030;--text3:#b08050;--glass:rgba(255,255,255,0.62);--border:rgba(212,148,58,0.3);--border2:rgba(212,148,58,0.18);--shadow:0 8px 32px rgba(160,100,30,0.15);--shadow-sm:0 2px 12px rgba(160,100,30,0.10);--r-xl:28px;--r-lg:20px;--r-md:14px;--r-sm:10px;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg0);min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 60% at 20% 10%,rgba(255,220,160,.35) 0%,transparent 60%),radial-gradient(ellipse 60% 80% at 85% 85%,rgba(255,200,140,.25) 0%,transparent 55%);pointer-events:none;z-index:0;}
.sakura-container{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1;overflow:hidden;}
.petal{position:absolute;top:-20px;animation:fall linear infinite;}
@keyframes fall{0%{transform:translateY(0) rotate(0deg) translateX(0);opacity:.6;}50%{transform:translateY(50vh) rotate(180deg) translateX(30px);opacity:.4;}100%{transform:translateY(105vh) rotate(360deg) translateX(-20px);opacity:0;}}
.app{position:relative;z-index:10;max-width:480px;margin:0 auto;padding:20px 14px 80px;}
.glass-card{background:var(--glass);border:1px solid var(--border);box-shadow:var(--shadow);}

/* 참여코드 화면 */
#screen-join{display:block;}
#screen-main{display:none;}
#screen-days{display:none;}

.join-card{border-radius:var(--r-xl);padding:36px 24px 32px;text-align:center;}
.join-cat{font-size:80px;display:block;margin-bottom:8px;animation:catFloat 3s ease-in-out infinite;}
@keyframes catFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
.join-title{font-family:'Gmarket Sans',sans-serif;font-size:22px;font-weight:700;color:var(--brown);margin-bottom:6px;}
.join-sub{font-size:13px;color:var(--text3);margin-bottom:32px;}

.join-section{margin-bottom:20px;text-align:left;}
.join-label{font-size:11px;font-weight:700;color:var(--gold);letter-spacing:.8px;text-transform:uppercase;margin-bottom:8px;display:block;}
.join-input{width:100%;padding:14px 16px;border-radius:var(--r-md);border:1.5px solid var(--border);background:var(--cream);font-size:20px;font-weight:700;color:var(--brown);font-family:'Gmarket Sans',sans-serif;text-align:center;letter-spacing:4px;outline:none;transition:border-color .2s;}
.join-input:focus{border-color:var(--gold);}
.join-input::placeholder{font-size:14px;letter-spacing:1px;color:var(--brown3);font-weight:400;}
.join-btn{width:100%;background:linear-gradient(135deg,var(--gold) 0%,var(--gold2) 100%);color:#fff;border:none;border-radius:var(--r-lg);padding:15px;font-size:15px;font-weight:700;cursor:pointer;font-family:'Gmarket Sans',inherit;box-shadow:0 4px 18px rgba(180,120,30,.35);transition:all .2s;margin-bottom:10px;}
.join-btn:active{transform:scale(.98);}
.join-btn.secondary{background:rgba(255,255,255,.6);color:var(--brown2);box-shadow:none;border:1.5px solid var(--border);}
.join-divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--text3);font-size:12px;}
.join-divider::before,.join-divider::after{content:'';flex:1;height:1px;background:var(--border);}

/* 세로 언어 토글 */
.lang-toggle-v{position:absolute;top:16px;right:16px;z-index:50;display:flex;flex-direction:column;background:rgba(255,255,255,.75);border:1px solid var(--border);border-radius:20px;overflow:hidden;box-shadow:0 2px 8px rgba(160,100,30,.12);}
.lang-btn{padding:6px 10px;font-size:11px;font-weight:700;cursor:pointer;color:var(--brown3);border:none;background:transparent;transition:all .2s;letter-spacing:.5px;font-family:inherit;line-height:1;}
.lang-btn.active{background:linear-gradient(135deg,var(--gold) 0%,var(--gold2) 100%);color:#fff;}

/* 메인카드 */
.main-card{border-radius:var(--r-xl);padding:24px 20px 22px;position:relative;}
.cat-wrap{display:flex;justify-content:center;margin-bottom:6px;position:relative;}
.cat-svg{width:120px;height:120px;filter:drop-shadow(0 6px 16px rgba(160,100,30,.2));animation:catFloat 3s ease-in-out infinite;}
.cat-bubble{position:absolute;top:0;left:14px;background:var(--cream);border:1.5px solid var(--border);border-radius:16px 16px 4px 16px;padding:7px 12px;font-size:11.5px;color:var(--brown);font-weight:600;white-space:nowrap;box-shadow:var(--shadow-sm);animation:bubblePop .4s cubic-bezier(.34,1.56,.64,1) forwards;}
.cat-bubble::after{content:'';position:absolute;bottom:-7px;right:14px;border:6px solid transparent;border-top-color:var(--cream);}
@keyframes bubblePop{from{transform:scale(.7);opacity:0;}to{transform:scale(1);opacity:1;}}

/* 참여코드 배지 */
.code-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(255,200,100,.2);border:1px solid rgba(200,150,50,.3);border-radius:12px;padding:5px 12px;font-size:12px;font-weight:700;color:var(--brown2);margin-bottom:14px;cursor:pointer;transition:all .2s;}
.code-badge:active{opacity:.7;}

.trip-title{font-family:'Gmarket Sans','Noto Sans KR',sans-serif;font-size:20px;font-weight:700;color:var(--brown);text-align:center;margin-bottom:3px;}
.trip-sub{text-align:center;font-size:12.5px;color:var(--text3);margin-bottom:18px;}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px;}
.info-cell{background:rgba(255,255,255,.5);border:1px solid var(--border2);border-radius:var(--r-md);padding:10px 12px;}
.info-cell .lbl{font-size:9.5px;color:var(--gold);font-weight:700;letter-spacing:.8px;text-transform:uppercase;margin-bottom:4px;}
.info-cell .val{font-size:13px;font-weight:700;color:var(--text);line-height:1.5;}
.flight-banner{background:rgba(255,200,100,.18);border:1px solid rgba(200,150,50,.3);border-radius:var(--r-md);padding:10px 14px;margin-bottom:12px;display:flex;align-items:center;gap:10px;}
.flight-no{font-size:12px;font-weight:700;color:var(--brown);margin-bottom:1px;}
.flight-detail{font-size:11px;color:var(--brown2);}
.hotel-badge{background:rgba(255,255,255,.5);border:1px solid var(--border2);border-radius:var(--r-sm);padding:8px 12px;font-size:11.5px;color:var(--text2);font-weight:500;margin-bottom:18px;}
.cta-btn{width:100%;background:linear-gradient(135deg,var(--gold) 0%,var(--gold2) 100%);color:#fff;border:none;border-radius:var(--r-lg);padding:14px;font-size:14.5px;font-weight:700;cursor:pointer;letter-spacing:.5px;box-shadow:0 4px 18px rgba(180,120,30,.35);transition:all .2s;font-family:'Gmarket Sans',inherit;}
.cta-btn:active{transform:scale(.98);opacity:.9;}
.weather-note{text-align:center;font-size:11px;color:var(--text3);margin-top:10px;opacity:.7;}

/* 일정 화면 */
.days-header{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.back-btn{background:var(--glass);border:1px solid var(--border);border-radius:var(--r-sm);padding:8px 14px;font-size:12.5px;color:var(--brown);font-weight:700;cursor:pointer;font-family:inherit;}
.days-title{font-size:13px;font-weight:700;color:var(--brown);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tab-bar{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;margin-bottom:12px;scrollbar-width:none;}
.tab-bar::-webkit-scrollbar{display:none;}
.tab{flex-shrink:0;padding:8px 18px;border-radius:var(--r-md);font-size:12.5px;font-weight:700;cursor:pointer;color:var(--brown3);background:rgba(255,255,255,.35);border:1px solid var(--border2);transition:all .2s;white-space:nowrap;font-family:'Gmarket Sans',inherit;}
.tab.active{background:linear-gradient(135deg,var(--gold) 0%,var(--gold2) 100%);color:#fff;border-color:transparent;box-shadow:0 3px 12px rgba(180,120,30,.3);}
.day-panel{display:none;}.day-panel.active{display:block;}
.day-header{border-radius:var(--r-lg);padding:13px 16px;margin-bottom:10px;box-shadow:var(--shadow-sm);}
.day-date{font-size:16px;font-weight:700;color:var(--brown);margin-bottom:2px;font-family:'Gmarket Sans',inherit;}
.day-sub{font-size:11px;color:var(--text3);}
.timeline{position:relative;padding-left:46px;}
.timeline::before{content:'';position:absolute;left:19px;top:8px;bottom:8px;width:1.5px;background:linear-gradient(to bottom,rgba(200,150,50,.5),rgba(200,150,50,.03));}
.ev{position:relative;margin-bottom:8px;}
.ev-dot{position:absolute;left:-31px;top:13px;width:9px;height:9px;border-radius:50%;background:rgba(180,140,70,.4);border:1.5px solid rgba(200,160,80,.5);}
.ev-dot.hi{width:11px;height:11px;left:-32px;top:12px;background:var(--gold);border-color:var(--gold2);box-shadow:0 0 0 3px rgba(200,150,40,.2);}
.ev-card{border-radius:var(--r-md);padding:10px 12px;background:rgba(255,255,255,.5);border:1px solid var(--border2);cursor:pointer;}
.ev-top{display:flex;align-items:center;gap:6px;margin-bottom:2px;}
.ev-time{font-size:10.5px;font-weight:700;color:var(--gold);min-width:36px;font-family:'Gmarket Sans',inherit;}
.ev-tag{font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:7px;white-space:nowrap;}
.tag-food{background:rgba(255,184,112,.3);color:#7a4200;}.tag-drink{background:rgba(100,200,140,.3);color:#1a5a30;}.tag-shop{background:rgba(200,140,255,.3);color:#501a8a;}.tag-nature{background:rgba(140,210,100,.3);color:#2a5208;}.tag-hotel{background:rgba(255,208,80,.3);color:#5a3800;}.tag-transport{background:rgba(100,170,255,.25);color:#1a3a8a;}.tag-reserved{background:rgba(255,130,130,.3);color:#7a1010;}.tag-tbd{background:rgba(180,180,180,.25);color:#4a4a4a;}
.ev-title{font-size:13.5px;font-weight:600;color:var(--text);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ev-loc{font-size:10.5px;color:var(--text3);margin-top:2px;}.ev-loc::before{content:'📍 ';}
.ev-desc{font-size:10.5px;color:var(--text2);margin-top:3px;line-height:1.5;}
.add-ev-btn{width:100%;background:rgba(255,255,255,.4);border:1.5px dashed rgba(200,150,50,.4);border-radius:var(--r-md);padding:10px;font-size:12px;color:var(--brown3);font-weight:600;cursor:pointer;margin-top:6px;font-family:inherit;}

/* 자동저장 인디케이터 */
.save-ind{position:fixed;top:14px;left:50%;transform:translateX(-50%) translateY(-8px);z-index:500;background:var(--brown);color:#fff;font-size:12px;font-weight:600;padding:7px 18px;border-radius:20px;opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap;}
.save-ind.show{opacity:1;transform:translateX(-50%) translateY(0);}
.save-ind.err{background:#8a1a1a;}

/* 편집 모달 */
.modal-overlay{position:fixed;inset:0;background:rgba(60,30,10,.4);backdrop-filter:blur(6px);z-index:1000;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s;}
.modal-overlay.open{opacity:1;pointer-events:auto;}
.modal{background:var(--bg0);border-radius:28px 28px 0 0;padding:24px 20px 36px;width:100%;max-width:480px;max-height:85vh;overflow-y:auto;transform:translateY(100%);transition:transform .3s cubic-bezier(.32,1,.6,1);box-shadow:0 -8px 40px rgba(100,60,10,.2);}
.modal-overlay.open .modal{transform:translateY(0);}
.modal-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 18px;}
.modal-title{font-size:16px;font-weight:700;color:var(--brown);margin-bottom:18px;font-family:'Gmarket Sans',inherit;}
.form-group{margin-bottom:14px;}
.form-label{display:block;font-size:11px;font-weight:700;color:var(--gold);letter-spacing:.6px;text-transform:uppercase;margin-bottom:6px;}
.form-input{width:100%;padding:10px 12px;border-radius:var(--r-sm);border:1.5px solid var(--border);background:var(--cream);font-size:14px;color:var(--text);font-family:inherit;outline:none;transition:border-color .2s;}
.form-input:focus{border-color:var(--gold);}
.form-select{width:100%;padding:10px 12px;border-radius:var(--r-sm);border:1.5px solid var(--border);background:var(--cream);font-size:14px;color:var(--text);font-family:inherit;outline:none;appearance:none;cursor:pointer;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.hl-toggle{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--cream);border-radius:var(--r-sm);border:1.5px solid var(--border);cursor:pointer;}
.hl-toggle input{width:16px;height:16px;accent-color:var(--gold);cursor:pointer;}
.hl-toggle span{font-size:13px;color:var(--text2);font-weight:500;}
.modal-actions{display:flex;gap:10px;margin-top:20px;}
.btn-save{flex:2;background:linear-gradient(135deg,var(--gold) 0%,var(--gold2) 100%);color:#fff;border:none;border-radius:var(--r-md);padding:13px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn-delete{flex:1;background:rgba(255,130,130,.2);color:#8a1a1a;border:1.5px solid rgba(255,130,130,.35);border-radius:var(--r-md);padding:13px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn-cancel{flex:1;background:rgba(180,140,70,.12);color:var(--brown2);border:1.5px solid var(--border2);border-radius:var(--r-md);padding:13px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}

/* 토스트 */
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--brown);color:#fff;font-size:13px;font-weight:600;padding:10px 20px;border-radius:20px;opacity:0;transition:all .3s;pointer-events:none;z-index:300;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* 로딩 */
.loading{text-align:center;padding:60px 20px;color:var(--text3);font-size:14px;}
.loading .spin{font-size:32px;display:block;margin-bottom:12px;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
</style>
</head>
<body>
<div class="sakura-container" id="sakura"></div>
<div class="app">

  <!-- 참여코드 화면 -->
  <div id="screen-join">
    <div class="join-card glass-card">
      <span class="join-cat">🐱</span>
      <div class="join-title">리호짱과 오사카 데이트</div>
      <div class="join-sub">참여코드를 입력하거나 새 여행을 만들어요</div>

      <div class="join-section">
        <span class="join-label">참여코드 입력</span>
        <input class="join-input" id="joinCodeInput" type="text" maxlength="6" placeholder="6자리 코드" oninput="this.value=this.value.toUpperCase()">
      </div>
      <button class="join-btn" onclick="joinTrip()">입장하기 →</button>

      <div class="join-divider">또는</div>

      <button class="join-btn secondary" onclick="createTrip()">✨ 새 여행 만들기</button>
    </div>
  </div>

  <!-- 메인 화면 -->
  <div id="screen-main">
    <div class="main-card glass-card">
      <div class="lang-toggle-v">
        <button class="lang-btn active" data-lang="ko" onclick="setLang('ko')">KO</button>
        <button class="lang-btn" data-lang="jp" onclick="setLang('jp')">JP</button>
      </div>
      <div class="cat-wrap">
        <div class="cat-bubble" id="catBubble">오사카 가자냥~! 🐾</div>
        <svg class="cat-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="100" cy="148" rx="46" ry="42" fill="#f5f0e8"/>
          <ellipse cx="100" cy="152" rx="28" ry="32" fill="#fffdf8"/>
          <path d="M146 175 Q180 168 178 148 Q176 130 158 132 Q148 133 148 143" stroke="#c8b89a" stroke-width="10" fill="none" stroke-linecap="round"/>
          <path d="M146 175 Q180 168 178 148 Q176 130 158 132 Q148 133 148 143" stroke="#a09078" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="6 4"/>
          <ellipse cx="76" cy="183" rx="12" ry="9" fill="#f5f0e8"/><ellipse cx="124" cy="183" rx="12" ry="9" fill="#f5f0e8"/>
          <ellipse cx="76" cy="188" rx="11" ry="6" fill="#fffdf8"/><ellipse cx="124" cy="188" rx="11" ry="6" fill="#fffdf8"/>
          <ellipse cx="100" cy="100" rx="44" ry="42" fill="#f5f0e8"/>
          <path d="M90 68 Q100 62 110 68" stroke="#c8b090" stroke-width="2.5" fill="none" stroke-linecap="round"/>
          <path d="M85 73 Q100 65 115 73" stroke="#c8b090" stroke-width="2" fill="none" stroke-linecap="round"/>
          <polygon points="65,72 58,44 82,60" fill="#f5f0e8"/><polygon points="67,69 62,50 78,62" fill="#f0c8c0"/>
          <polygon points="135,72 142,44 118,60" fill="#f5f0e8"/><polygon points="133,69 138,50 122,62" fill="#f0c8c0"/>
          <ellipse cx="84" cy="100" rx="14" ry="14" fill="white"/><ellipse cx="116" cy="100" rx="14" ry="14" fill="white"/>
          <ellipse cx="84" cy="101" rx="9" ry="10" fill="#7a6040"/><ellipse cx="116" cy="101" rx="9" ry="10" fill="#7a6040"/>
          <ellipse cx="84" cy="102" rx="5" ry="7" fill="#1a1208"/><ellipse cx="116" cy="102" rx="5" ry="7" fill="#1a1208"/>
          <circle cx="88" cy="97" r="2.5" fill="white"/><circle cx="120" cy="97" r="2.5" fill="white"/>
          <ellipse cx="84" cy="100" rx="14" ry="14" fill="none" stroke="#c8a870" stroke-width="1.2"/>
          <ellipse cx="116" cy="100" rx="14" ry="14" fill="none" stroke="#c8a870" stroke-width="1.2"/>
          <path d="M96 113 Q100 110 104 113 Q100 117 96 113Z" fill="#f0a0a0"/>
          <path d="M100 117 Q96 122 93 121" stroke="#c88080" stroke-width="1.8" fill="none" stroke-linecap="round"/>
          <path d="M100 117 Q104 122 107 121" stroke="#c88080" stroke-width="1.8" fill="none" stroke-linecap="round"/>
          <line x1="82" y1="113" x2="58" y2="109" stroke="#c8b090" stroke-width="1.3" stroke-linecap="round"/>
          <line x1="82" y1="116" x2="56" y2="116" stroke="#c8b090" stroke-width="1.3" stroke-linecap="round"/>
          <line x1="82" y1="119" x2="58" y2="122" stroke="#c8b090" stroke-width="1.3" stroke-linecap="round"/>
          <line x1="118" y1="113" x2="142" y2="109" stroke="#c8b090" stroke-width="1.3" stroke-linecap="round"/>
          <line x1="118" y1="116" x2="144" y2="116" stroke="#c8b090" stroke-width="1.3" stroke-linecap="round"/>
          <line x1="118" y1="119" x2="142" y2="122" stroke="#c8b090" stroke-width="1.3" stroke-linecap="round"/>
          <ellipse cx="74" cy="113" rx="8" ry="5" fill="#ffb0b0" opacity="0.35"/>
          <ellipse cx="126" cy="113" rx="8" ry="5" fill="#ffb0b0" opacity="0.35"/>
          <path d="M70 135 Q100 140 130 135" stroke="#e8b040" stroke-width="3" fill="none" stroke-linecap="round"/>
          <circle cx="100" cy="141" r="5" fill="#e8b040"/><circle cx="100" cy="141" r="3" fill="#f8d060"/>
        </svg>
      </div>

      <div style="text-align:center;margin-bottom:12px;">
        <span class="code-badge" onclick="copyCode()" id="codeBadge">🔑 코드: <span id="codeDisplay">------</span> 복사</span>
      </div>

      <div class="trip-title" data-ko="리호짱과 오사카 데이트" data-jp="りほちゃんと大阪デート">리호짱과 오사카 데이트</div>
      <div class="trip-sub" data-ko="쩨하 × りほ · 오사카 2박3일" data-jp="쩨하 × りほ · 大阪 2泊3日">쩨하 × りほ · 오사카 2박3일</div>

// ── 참여코드 생성 ──
function genCode() {
  return Math.random().toString(36).substring(2,8).toUpperCase();
}

// ── 새 여행 만들기 ──
async function createTrip() {
  showInd('✨ 여행 만드는 중...', false, true);
  const code = genCode();
  const { data, error } = await sb.from('trips').insert({
    code: code,
    days: DEFAULT_DAYS
  }).select().single();

  if (error) { showInd('❌ 실패: ' + error.message, true, false); setTimeout(hideInd, 2500); return; }
  hideInd();
  enterTrip(data.id, code, data.days);
}

// ── 참여코드로 입장 ──
async function joinTrip() {
  const code = document.getElementById('joinCodeInput').value.trim().toUpperCase();
  if (code.length !== 6) { toast('6자리 코드를 입력해줘 🐾'); return; }

  showInd('🔍 찾는 중...', false, true);
  const { data, error } = await sb.from('trips').select('*').eq('code', code).single();

  if (error || !data) { hideInd(); toast('❌ 코드를 찾을 수 없어요'); return; }
  hideInd();
  enterTrip(data.id, data.code, data.days);
}

// ── 여행 진입 ──
function enterTrip(id, code, days) {
  currentTripId = id;
  currentCode = code;
  DATA = { days: days };
  document.getElementById('codeDisplay').textContent = code;
  localStorage.setItem('last_trip', JSON.stringify({ id, code }));
  document.getElementById('screen-join').style.display = 'none';
  document.getElementById('screen-main').style.display = 'block';
  renderDays();
  initSakura();
  initBubble();
  // 실시간 구독
  subscribeRealtime();
}

// ── 실시간 구독 (다른 사람이 수정하면 자동 반영) ──
function subscribeRealtime() {
  sb.channel('trip-' + currentTripId)
    .on('postgres_changes', {
      event: 'UPDATE', schema: 'public', table: 'trips',
      filter: 'id=eq.' + currentTripId
    }, payload => {
      DATA = { days: payload.new.days };
      renderDays();
      toast('🔄 일정이 업데이트됐냥~!');
    })
    .subscribe();
}

// ── 코드 복사 ──
function copyCode() {
  navigator.clipboard.writeText(currentCode).then(() => toast('📋 코드 복사됐냥! 리호짱한테 보내줘 🐾'));
}

// ── 자동저장 ──
function schedSave() { clearTimeout(saveTimer); saveTimer = setTimeout(autoSave, 800); }
async function autoSave() {
  if (!currentTripId) return;
  showInd('💾 저장 중...', false, true);
  const { error } = await sb.from('trips').update({ days: DATA.days }).eq('id', currentTripId);
  if (error) { showInd('❌ 저장 실패', true, false); setTimeout(hideInd, 2500); }
  else { showInd('✅ 저장됐냥~!', false, false); setTimeout(hideInd, 1800); }
}

// ── 렌더링 ──
function renderDays() {
  const tb = document.getElementById('tabBar'), dp = document.getElementById('dayPanels');
  tb.innerHTML = ''; dp.innerHTML = '';
  DATA.days.forEach((day, di) => {
    const t = document.createElement('div');
    t.className = 'tab' + (di===0?' active':''); t.id = 'tab'+di;
    t.textContent = 'DAY '+day.day; t.onclick = ()=>switchDay(di); tb.appendChild(t);
    const ko = currentLang==='ko';
    const p = document.createElement('div');
    p.className = 'day-panel'+(di===0?' active':''); p.id = 'day'+di;
    p.innerHTML = `<div class="day-header glass-card"><div class="day-date">${ko?day.date:day.date_jp} · Day ${day.day}</div><div class="day-sub">${ko?day.theme:day.theme_jp}</div></div><div class="timeline" id="tl${di}"></div><button class="add-ev-btn" onclick="openAddModal(${di})">＋ 일정 추가</button>`;
    dp.appendChild(p); renderEv(di);
  });
}

function renderEv(di) {
  const tl = document.getElementById('tl'+di); if (!tl) return;
  const ko = currentLang==='ko'; tl.innerHTML = '';
  DATA.days[di].events.forEach((ev, ei) => {
    const cat = CAT[ev.category]||CAT.tbd;
    const el = document.createElement('div'); el.className = 'ev';
    const loc = ko?ev.location:(ev.location_jp||ev.location);
    const desc = ko?(ev.desc||''):(ev.desc_jp||ev.desc||'');
    el.innerHTML = `<div class="ev-dot ${ev.highlight?'hi':''}"></div><div class="ev-card" onclick="openEditModal(${di},${ei})"><div class="ev-top"><span class="ev-time">${ev.time}</span><span class="ev-tag ${cat.c}">${ko?cat.l:cat.lj}</span><span class="ev-title">${ko?ev.title:(ev.title_jp||ev.title)}</span></div>${loc?`<div class="ev-loc">${loc}</div>`:''}${desc?`<div class="ev-desc">${desc}</div>`:''}</div>`;
    tl.appendChild(el);
  });
}

// ── 언어 토글 ──
function setLang(lang) {
  currentLang = lang;
  document.body.style.fontFamily = lang==='jp' ? "'Noto Sans JP',sans-serif" : "'Noto Sans KR',sans-serif";
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang===lang));
  document.querySelectorAll('[data-ko]:not(.lang-btn)').forEach(el => { el.innerHTML = el.getAttribute('data-'+lang)||el.getAttribute('data-ko'); });
  if (DATA) DATA.days.forEach((day, di) => {
    const de = document.querySelector('#day'+di+' .day-date');
    const se = document.querySelector('#day'+di+' .day-sub');
    if (de) de.textContent = (lang==='ko'?day.date:day.date_jp)+' · Day '+day.day;
    if (se) se.textContent = lang==='ko'?day.theme:day.theme_jp;
    renderEv(di);
  });
  changeBubble(lang);
}

// ── 화면 전환 ──
function openDays() { document.getElementById('screen-main').style.display='none'; document.getElementById('screen-days').style.display='block'; switchDay(0); scrollTo(0,0); }
function goBack() { document.getElementById('screen-days').style.display='none'; document.getElementById('screen-main').style.display='block'; scrollTo(0,0); }
function switchDay(di) { document.querySelectorAll('.day-panel').forEach(p=>p.classList.remove('active')); document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active')); document.getElementById('day'+di)?.classList.add('active'); document.getElementById('tab'+di)?.classList.add('active'); scrollTo(0,0); }

// ── 편집 모달 ──
function openEditModal(di, ei) {
  const ev = DATA.days[di].events[ei];
  editingDay=di; editingIdx=ei; modalMode='edit';
  document.getElementById('modalTitle').textContent = '일정 편집';
  document.getElementById('fTime').value = ev.time;
  document.getElementById('fCategory').value = ev.category;
  document.getElementById('fTitle').value = ev.title;
  document.getElementById('fTitleJp').value = ev.title_jp||'';
  document.getElementById('fLoc').value = ev.location||'';
  document.getElementById('fLocJp').value = ev.location_jp||'';
  document.getElementById('fDesc').value = ev.desc||'';
  document.getElementById('fHighlight').checked = ev.highlight;
  document.getElementById('modalActions').innerHTML = `<button class="btn-delete" onclick="deleteEv()">삭제</button><button class="btn-cancel" onclick="closeModal()">취소</button><button class="btn-save" onclick="saveEv()">저장</button>`;
  document.getElementById('modalOverlay').classList.add('open');
}
function openAddModal(di) {
  editingDay=di; editingIdx=null; modalMode='add';
  document.getElementById('modalTitle').textContent = '일정 추가';
  ['fTime','fTitle','fTitleJp','fLoc','fLocJp','fDesc'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('fCategory').value = 'food';
  document.getElementById('fHighlight').checked = false;
  document.getElementById('modalActions').innerHTML = `<button class="btn-cancel" onclick="closeModal()">취소</button><button class="btn-save" onclick="saveEv()">추가</button>`;
  document.getElementById('modalOverlay').classList.add('open');
}
function closeModal(e) { if(e&&e.target!==document.getElementById('modalOverlay'))return; document.getElementById('modalOverlay').classList.remove('open'); }
function saveEv() {
  const ev = { time:document.getElementById('fTime').value||'00:00', category:document.getElementById('fCategory').value, title:document.getElementById('fTitle').value||'(제목 없음)', title_jp:document.getElementById('fTitleJp').value, location:document.getElementById('fLoc').value, location_jp:document.getElementById('fLocJp').value, desc:document.getElementById('fDesc').value, highlight:document.getElementById('fHighlight').checked };
  const evs = DATA.days[editingDay].events;
  if (modalMode==='add') evs.push(ev); else evs[editingIdx]=ev;
  evs.sort((a,b)=>a.time.localeCompare(b.time));
  document.getElementById('modalOverlay').classList.remove('open');
  renderEv(editingDay); schedSave();
}
function deleteEv() {
  if (!confirm('이 일정을 삭제할까요?')) return;
  DATA.days[editingDay].events.splice(editingIdx,1);
  document.getElementById('modalOverlay').classList.remove('open');
  renderEv(editingDay); schedSave();
}

// ── 인디케이터 / 토스트 ──
function showInd(msg,err,p){const e=document.getElementById('saveInd');e.textContent=msg;e.className='save-ind show'+(err?' err':'');}
function hideInd(){document.getElementById('saveInd').classList.remove('show');}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400);}

// ── 벚꽃 ──
function initSakura(){const c=document.getElementById('sakura'),p=['🌸','🌸','🌸','🌷','✿'];for(let i=0;i<12;i++){const el=document.createElement('div');el.className='petal';el.textContent=p[~~(Math.random()*p.length)];el.style.cssText=`left:${Math.random()*100}%;font-size:${10+Math.random()*8}px;animation-duration:${6+Math.random()*8}s;animation-delay:${-Math.random()*12}s;opacity:${.3+Math.random()*.4}`;c.appendChild(el);}}

// ── 말풍선 ──
const BK=['오사카 가자냥~! 🐾','냥냥 설레는냥 🌸','리호짱 보고싶냥 😻','맛있는거 먹자냥 🍜','데이트 가자냥냥 💕'];
const BJ=['大阪行くにゃ~! 🐾','わくわくにゃ 🌸','りほちゃん会いたいにゃ 😻','美味しいもの食べるにゃ 🍜','デートするにゃにゃ 💕'];
function initBubble(){let i=0;setInterval(()=>{i=(i+1)%BK.length;changeBubble(currentLang,i);},4000);}
function changeBubble(lang,idx){const b=document.getElementById('catBubble');if(!b)return;const a=lang==='jp'?BJ:BK;const i=idx!==undefined?idx:~~(Math.random()*a.length);b.style.animation='none';b.offsetHeight;b.style.animation='';b.textContent=a[i];}

// ── 초기화 ──
function resetTrip() {
  if (!confirm('코드 입력 화면으로 돌아갈까요?')) return;
  localStorage.removeItem('last_trip');
  currentTripId = null; currentCode = null; DATA = null;
  document.getElementById('screen-main').style.display = 'none';
  document.getElementById('screen-days').style.display = 'none';
  document.getElementById('screen-join').style.display = 'block';
  document.getElementById('joinCodeInput').value = '';
}

// ── 초기화: 마지막 여행 자동 복구 ──
(async function init(){
  const last = JSON.parse(localStorage.getItem('last_trip')||'null');
  if (last?.id && last?.code) {
    showInd('☁️ 불러오는 중...', false, true);
    const { data, error } = await sb.from('trips').select('*').eq('id', last.id).single();
    if (!error && data) { hideInd(); enterTrip(data.id, data.code, data.days); return; }
    hideInd();
  }
  initSakura();
})();
</script>
